stages:
  - build
  - test

image: debian:trixie-slim

.apt_setup: &apt_setup
  - rm -f /etc/apt/sources.list
  - rm -rf /etc/apt/sources.list.d/*
  - echo "deb http://mirror.selectel.ru/debian trixie main contrib non-free non-free-firmware" > /etc/apt/sources.list
  - echo "deb-src http://mirror.selectel.ru/debian trixie main" >> /etc/apt/sources.list
  - apt-get update
  - apt-get dist-upgrade -y
  - apt-get install -y ca-certificates

build:
  stage: build
  before_script:
    - *apt_setup
    - |
      apt-get install -y --allow-downgrades \
        pkg-config \
        build-essential \
        libpcre2-dev \
        zlib1g-dev \
        libssl3t64 \
        libssl-dev \
        nginx \
        libonnxruntime-dev

    - apt-get source nginx
    - mv nginx-* nginx

  script:
    - cd nginx
    - |
      ./configure \
      --add-dynamic-module=.. \
      --with-compat \
      --with-debug
    - make modules

  artifacts:
    paths:
      - nginx/objs/*.so

test:
  stage: test
  dependencies:
    - build
  before_script:
    - *apt_setup
    - apt-get install -y curl nginx libonnxruntime-dev

    - cp model.onnx /etc/nginx/model.onnx

    - mkdir -p /tmp/nginx-modules
    - cp nginx/objs/ngx_http_ml_ddos_module.so /tmp/nginx-modules/

    - mkdir -p /etc/nginx/logs
    - |
      cat > /etc/nginx/nginx.conf <<EOF
      load_module /tmp/nginx-modules/ngx_http_ml_ddos_module.so;

      events {}

      error_log /etc/nginx/logs/error.log info;

      thread_pool ml_ddos threads=4 max_queue=65536;

      http {
          ml_ddos_path /etc/nginx/model.onnx;
          server {
              listen 8080;

              location /ml_async {
                  ml_ddos on thread=ml_ddos block=0.8 limit=0.6;
                  default_type text/plain;
                  return 200 "ML\n";
              }

              location /ml_async_sampling {
                  ml_ddos on thread=ml_ddos mode=sampling;
                  default_type text/plain;
                  return 200 "ML\n";
              }

              location /ml_sync {
                  ml_ddos on;
                  default_type text/plain;
                  return 200 "ML\n";
              }

              location /no_ml {
                  ml_ddos off;
                  default_type text/plain;
                  return 200 "NO_ML\n";
              }

              location /default {
                  default_type text/plain;
                  return 200 "Default\n";
              }
          }
      }
      EOF
  script:
    - nginx -v
    - nginx -t 
    - nginx

    - sleep 2
    - cat /etc/nginx/logs/error.log

    - >
      curl -s -D - http://127.0.0.1:8080/ml_async -o /dev/null | grep -q "X-HTTP-ML-DDOS: Enabled" && echo "PASS: ml"

    - >
      curl -s -D - http://127.0.0.1:8080/ml_async_sampling -o /dev/null | grep -q "X-HTTP-ML-DDOS: Enabled" && echo "PASS: ml"

    - >
      curl -s -D - http://127.0.0.1:8080/ml_sync -o /dev/null | grep -q "X-HTTP-ML-DDOS: Enabled" && echo "PASS: ml"

    - |
      if curl -s -D - http://127.0.0.1:8080/no_ml -o /dev/null | grep -q "X-HTTP-ML-DDOS: Enabled"; then
        echo "FAIL: header should not exist"
        exit 1
      else
        echo "PASS: no_ml"
      fi

    - |
      if curl -s -D - http://127.0.0.1:8080/default -o /dev/null | grep -q "X-HTTP-ML-DDOS: Enabled"; then
        echo "FAIL: ml_ddos off by default"
        exit 1
      else
      echo "PASS: default"
      fi

    - nginx -s stop
